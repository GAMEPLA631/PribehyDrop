<!DOCTYPE html>
<html lang="sk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MojaSieť - Verejná Cloud Databáza</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
                    colors: {
                        md: {
                            primary: '#6750A4',
                            onPrimary: '#FFFFFF',
                            primaryContainer: '#EADDFF',
                            onPrimaryContainer: '#21005D',
                            surface: '#FEF7FF',
                            surfaceContainerLow: '#F7F2FA',
                            surfaceContainerHigh: '#ECE6F0',
                            onSurface: '#1D1B20',
                            onSurfaceVariant: '#49454F',
                            outlineVariant: '#CAC4D0',
                            error: '#BA1A1A'
                        }
                    }
                }
            }
        }
    </script>
    
    <style>
        body { background-color: #F6F4F9; color: #1D1B20; }
        .material-symbols-outlined { line-height: 1; vertical-align: middle; }
        .md-text-field { position: relative; margin-bottom: 1.25rem; }
        .md-input { width: 100%; padding: 15px 16px; border: 1.5px solid #CAC4D0; border-radius: 12px; background-color: transparent; font-size: 0.975rem; color: #1D1B20; }
        .md-input:focus { outline: none; border-color: #6750A4; box-shadow: 0 0 0 2px rgba(103, 80, 164, 0.15); }
        .md-label { position: absolute; left: 14px; top: 16px; padding: 0 6px; background-color: #FEF7FF; color: #49454F; font-size: 0.95rem; pointer-events: none; transition: all 0.2s; }
        .md-input:focus ~ .md-label, .md-input:not(:placeholder-shown) ~ .md-label { transform: translateY(-25px) scale(0.8); color: #6750A4; font-weight: 600; }
        .modal-overlay { opacity: 0; pointer-events: none; transition: opacity 0.2s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
    </style>
</head>
<body class="flex flex-col min-h-screen antialiased">

    <!-- Horný panel -->
    <header class="bg-md-surface/90 backdrop-blur-md border-b border-md-outlineVariant/30 sticky top-0 z-30">
        <div class="max-w-3xl mx-auto px-4 h-16 flex items-center justify-between">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-md-primary to-md-primaryContainer flex items-center justify-center text-white shadow-md">
                    <span class="material-symbols-outlined text-2xl">public</span>
                </div>
                <div>
                    <h1 class="text-xl font-bold tracking-tight text-md-onSurface leading-none">MojaSieť</h1>
                    <span class="text-[11px] font-semibold text-emerald-600 flex items-center gap-1 mt-0.5">
                        <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Verejný Cloud Aktívny
                    </span>
                </div>
            </div>
            
            <div class="flex items-center gap-2">
                <div id="authStateContainer">
                    <button id="loginBtn" onclick="openAuthModal()" class="px-5 py-2 rounded-full font-semibold text-sm bg-md-primary text-white shadow-md hover:bg-opacity-95 flex items-center gap-2">
                        <span class="material-symbols-outlined text-lg">login</span>
                        <span>Prihlásiť sa</span>
                    </button>
                    
                    <div id="userMenuContainer" class="hidden flex items-center gap-2 bg-md-surfaceContainerHigh px-3.5 py-1.5 rounded-full border border-md-outlineVariant/30">
                        <span id="userNameDisplay" class="text-sm font-bold text-md-onSurface">Používateľ</span>
                        <button onclick="logout()" class="text-xs text-md-error font-bold hover:underline ml-2">Odhlásiť</button>
                    </div>
                </div>
            </div>
        </div>
    </header>

    <main class="flex-grow max-w-3xl w-full mx-auto px-4 py-6 sm:py-8">
        
        <!-- Welcome Banner -->
        <div id="welcomeBanner" class="bg-gradient-to-r from-md-primaryContainer to-md-surfaceContainerHigh text-md-onPrimaryContainer rounded-3xl p-6 sm:p-8 mb-8 shadow-sm border border-white/60 flex flex-col sm:flex-row items-center justify-between gap-6">
            <div>
                <h2 class="text-2xl font-bold tracking-tight mb-1">Vitajte na MojaSieť</h2>
                <p class="text-sm text-md-onSurfaceVariant max-w-md">Všetky príspevky sa ukladajú online a sú verejné pre každého.</p>
            </div>
            <button onclick="openAuthModal()" class="bg-md-primary text-white px-7 py-3 rounded-full font-semibold shadow-md whitespace-nowrap">
                Prihlásiť sa
            </button>
        </div>

        <!-- Vytvoriť príspevok -->
        <div id="createPostCard" class="hidden bg-md-surface rounded-3xl shadow-sm mb-8 border border-md-outlineVariant/30 p-5 sm:p-6">
            <div class="md-text-field mb-2">
                <textarea id="postContentInput" rows="2" class="md-input resize-none" placeholder=" "></textarea>
                <label class="md-label">Napíšte niečo na verejnú nástenku...</label>
            </div>
            <div class="md-text-field mb-3">
                <input type="url" id="postImageUrlInput" class="md-input" placeholder=" ">
                <label class="md-label">URL obrázka (voliteľné)</label>
            </div>
            <div class="flex justify-end pt-2 border-t border-md-surfaceContainerHigh">
                <button id="submitPostBtn" onclick="submitNewPost()" class="bg-md-primary text-white px-7 py-2.5 rounded-full font-semibold shadow-md flex items-center gap-2">
                    <span class="material-symbols-outlined text-lg">send</span>
                    <span>Zverejniť príspevok</span>
                </button>
            </div>
        </div>

        <!-- Nástenka -->
        <div class="flex justify-between items-center px-2 mb-3">
            <h2 class="text-lg font-bold">Najnovšie príspevky</h2>
            <button onclick="loadPosts()" class="p-2 text-md-onSurfaceVariant hover:bg-md-surfaceContainerHigh rounded-full">
                <span class="material-symbols-outlined">refresh</span>
            </button>
        </div>

        <div id="loadingIndicator" class="text-center py-12 text-sm text-md-onSurfaceVariant">
            <div class="animate-spin rounded-full h-8 w-8 border-4 border-md-primary/20 border-t-md-primary mx-auto mb-2"></div>
            Načítavam príspevky...
        </div>
        
        <div id="postsList" class="space-y-4"></div>
        
        <div id="emptyState" class="hidden text-center py-12 bg-md-surface rounded-3xl border border-md-outlineVariant/30 p-6">
            <p class="font-bold">Zatiaľ tu nie sú žiadne príspevky.</p>
            <p class="text-sm text-md-onSurfaceVariant mt-1">Prihláste sa a pridajte prvý príspevok.</p>
        </div>
    </main>

    <!-- Auth Modal (Meno + 5-miestny PIN) -->
    <div id="authModal" class="modal-overlay fixed inset-0 z-50 flex items-center justify-center bg-black/50 p-4">
        <div class="bg-md-surface w-full max-w-md rounded-3xl p-6 sm:p-8 shadow-xl">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-bold">Prihlásenie / Registrácia</h2>
                <button onclick="closeAuthModal()"><span class="material-symbols-outlined">close</span></button>
            </div>
            
            <form onsubmit="handleAuth(event)" class="space-y-3">
                <div class="md-text-field">
                    <input type="text" id="authName" required class="md-input" placeholder=" ">
                    <label class="md-label">Meno alebo Prezývka</label>
                </div>
                <div class="md-text-field">
                    <input type="password" id="authPin" required minlength="5" maxlength="5" pattern="[0-9]{5}" inputmode="numeric" class="md-input font-mono tracking-widest" placeholder=" ">
                    <label class="md-label">5-miestny PIN (napr. 12345)</label>
                </div>
                <button type="submit" class="w-full bg-md-primary text-white py-3 rounded-full font-semibold shadow-md">
                    Vstúpiť
                </button>
            </form>
        </div>
    </div>

    <!-- Snackbar -->
    <div id="snackbar" class="fixed bottom-6 left-1/2 transform -translate-x-1/2 bg-[#2E2C30] text-[#F5EFF4] px-5 py-3 rounded-2xl shadow-xl text-sm font-medium flex items-center gap-2.5 z-[100] transition-all duration-300 translate-y-20 opacity-0 pointer-events-none min-w-[280px]">
        <span id="snackbarMessage">Správa</span>
    </div>

    <script>
        // Verejný cloud endpoint pre tvoju sieť (BannaTube Network)
        const CLOUD_API = "https://kvdb.io/8y4Yd9oE7Q8qXqQ4H8XqL1/bannatube_posts";

        let currentUser = localStorage.getItem('mojasiet_user') || "";
        let posts = [];

        async function loadPosts() {
            document.getElementById('loadingIndicator').classList.remove('hidden');
            document.getElementById('emptyState').classList.add('hidden');
            document.getElementById('postsList').innerHTML = '';

            try {
                const res = await fetch(CLOUD_API);
                if (res.ok) {
                    posts = await res.json();
                } else {
                    posts = JSON.parse(localStorage.getItem('mojasiet_local_posts') || '[]');
                }
            } catch (err) {
                console.warn("Chyba cloudu, načítavam lokálne:", err);
                posts = JSON.parse(localStorage.getItem('mojasiet_local_posts') || '[]');
            }

            renderPosts();
        }

        async function submitNewPost() {
            if (!currentUser) return openAuthModal();

            const text = document.getElementById('postContentInput').value.trim();
            const img = document.getElementById('postImageUrlInput').value.trim();

            if (!text && !img) {
                return showSnackbar('Príspevok nemôže byť prázdny');
            }

            const btn = document.getElementById('submitPostBtn');
            btn.disabled = true;
            btn.innerText = "Zverejňujem...";

            const newPost = {
                id: 'post_' + Date.now(),
                content: text,
                imageUrl: img,
                createdAt: Date.now(),
                authorName: currentUser
            };

            const updatedPosts = [newPost, ...posts];

            try {
                // Uloženie do verejného cloudu
                await fetch(CLOUD_API, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(updatedPosts)
                });
                showSnackbar('Príspevok bol zverejnený online!');
            } catch (err) {
                showSnackbar('Uložené lokálne');
            }

            posts = updatedPosts;
            localStorage.setItem('mojasiet_local_posts', JSON.stringify(posts));

            document.getElementById('postContentInput').value = '';
            document.getElementById('postImageUrlInput').value = '';
            renderPosts();

            btn.disabled = false;
            btn.innerHTML = `<span class="material-symbols-outlined text-lg">send</span><span>Zverejniť príspevok</span>`;
        }

        function renderPosts() {
            document.getElementById('loadingIndicator').classList.add('hidden');
            const list = document.getElementById('postsList');
            list.innerHTML = '';

            if (!posts || posts.length === 0) {
                document.getElementById('emptyState').classList.remove('hidden');
                return;
            }

            document.getElementById('emptyState').classList.add('hidden');

            posts.forEach(post => {
                const dateStr = new Date(post.createdAt || Date.now()).toLocaleDateString('sk-SK', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
                const imgHtml = post.imageUrl ? `<img src="${post.imageUrl}" class="mt-3 rounded-2xl max-h-80 w-full object-cover border border-md-outlineVariant/30">` : '';

                list.innerHTML += `
                    <article class="bg-md-surface p-5 rounded-3xl shadow-sm border border-md-outlineVariant/30">
                        <div class="flex items-center gap-3 mb-2">
                            <div class="w-10 h-10 rounded-2xl bg-md-primaryContainer text-md-onPrimaryContainer font-bold flex items-center justify-center">
                                ${post.authorName ? post.authorName.substring(0, 2).toUpperCase() : 'U'}
                            </div>
                            <div>
                                <h4 class="font-bold text-sm leading-tight">${post.authorName || 'Používateľ'}</h4>
                                <span class="text-xs text-md-onSurfaceVariant">${dateStr}</span>
                            </div>
                        </div>
                        <p class="text-sm mt-2 whitespace-pre-wrap leading-relaxed">${post.content || ''}</p>
                        ${imgHtml}
                    </article>
                `;
            });
        }

        function handleAuth(e) {
            e.preventDefault();
            const name = document.getElementById('authName').value.trim();
            const pin = document.getElementById('authPin').value.trim();

            if (pin.length !== 5 || !/^\d{5}$/.test(pin)) {
                return showSnackbar('PIN musí mať presne 5 číslic!');
            }

            currentUser = name;
            localStorage.setItem('mojasiet_user', currentUser);
            updateUserUI();
            closeAuthModal();
            showSnackbar(`Vitajte, ${currentUser}!`);
        }

        function logout() {
            currentUser = "";
            localStorage.removeItem('mojasiet_user');
            updateUserUI();
            showSnackbar('Boli ste odhlásení');
        }

        function updateUserUI() {
            if (currentUser) {
                document.getElementById('loginBtn').classList.add('hidden');
                document.getElementById('userMenuContainer').classList.remove('hidden');
                document.getElementById('welcomeBanner').classList.add('hidden');
                document.getElementById('createPostCard').classList.remove('hidden');
                document.getElementById('userNameDisplay').textContent = currentUser;
            } else {
                document.getElementById('loginBtn').classList.remove('hidden');
                document.getElementById('userMenuContainer').classList.add('hidden');
                document.getElementById('welcomeBanner').classList.remove('hidden');
                document.getElementById('createPostCard').classList.add('hidden');
            }
        }

        function openAuthModal() { document.getElementById('authModal').classList.add('active'); }
        function closeAuthModal() { document.getElementById('authModal').classList.remove('active'); }

        function showSnackbar(msg) {
            const sb = document.getElementById('snackbar');
            document.getElementById('snackbarMessage').textContent = msg;
            sb.classList.remove('translate-y-20', 'opacity-0', 'pointer-events-none');
            setTimeout(() => sb.classList.add('translate-y-20', 'opacity-0', 'pointer-events-none'), 3500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateUserUI();
            loadPosts();
        });
    </script>
</body>
</html>
